  <head>
    <title>Extended ISPyB</title>

    <script src="../node_modules/@scientific-software-hub/extjs/build/packages/ext-theme-crisp/build/ext-theme-crisp.js"></script>
    <script>
      // Theme CSS is added as a DOM element rather than a static <link> tag
      // because Vite processes every <link rel="stylesheet" href="local
      // path"> it finds in the HTML source through its CSS pipeline
      // (PostCSS), with no opt-out equivalent to <script>'s
      // type="module" escape hatch. This file's old-IE
      // `filter:progid:...` syntax fails that strict parser (verified) --
      // browsers have always tolerated it fine. The file itself is copied
      // verbatim by vite-plugin-static-copy (see vite.config.js).
      (function () {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '../node_modules/@scientific-software-hub/extjs/build/packages/ext-theme-crisp/build/resources/ext-theme-crisp-all.css';
        document.currentScript.insertAdjacentElement('afterend', link);
      })();
    </script>

    <!-- Vendor JS -- concatenated (not minified) by Grunt before this
         migration; each stays a classic global script, referenced
         individually so cross-plugin globals ($.fn.*, etc.) attach to the
         one shared jQuery instance in the order they always have. -->

    <!-- Vendored/minified third-party code kept as classic scripts -- not
         ESM-converted (assigns to many single-letter identifiers
         incompatible with strict mode). Loaded before js/main.js since
         classic scripts run synchronously during parsing, ahead of any
         deferred module. -->
    <script src="../js/tools/a_three49custom.js"></script>
    <script src="../js/tools/b_GLmol_modified.js"></script>

    <!-- EXI application code -->
    <script type="module" src="../js/main.js"></script>
    <link rel="stylesheet" href="../css/main.css">

    <script src="config.js"></script>
  </head>
  <body>
    <script type="module">
      // type="module" (not a classic script) so this runs deferred, in
      // document order relative to js/main.js -- a classic inline script
      // here would run synchronously during parsing, before main.js (also
      // deferred) has finished, and see ExiMX/ExiSAXS undefined.
      function isNumber(value) {
        if (value == "") return false;
        var d = parseInt(value);
        return !isNaN(d);
      }
      var exiSAXS;
      Ext.onReady(function () {
        Ext.Loader.setConfig({ enabled: true });
        Ext.Loader.setPath('Ext.ux', '../node_modules/@scientific-software-hub/extjs/examples/ux/');
        Ext.Loader.setPath('Ext.Extended', '../node_modules/@scientific-software-hub/extjs/extended/');

        Ext.require([
          'Ext.ux.statusbar.StatusBar',
          'Ext.Extended.RequiredTextField',
          'Ext.Extended.RequiredNumberField',
        ]);

        if (location.href.indexOf('saxs') != -1) {
          window.EXI = new ExiSAXS();
        } else {
          window.EXI = new ExiMX();
        }

        EXI.show();

        EXI.onAfterRender.attach(function () {
          Path.listen();
        });
      });
    </script>
  </body>
</html>
