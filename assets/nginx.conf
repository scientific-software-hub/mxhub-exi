worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Per-deployment server block (ISPyB upstream, cache rules) lives in
    # default.conf.template. The official nginx image auto-substitutes
    # ${...}-style env vars in any *.template file under
    # /etc/nginx/templates/ into /etc/nginx/conf.d/ at container start --
    # see Dockerfile.
    include /etc/nginx/conf.d/*.conf;
}
